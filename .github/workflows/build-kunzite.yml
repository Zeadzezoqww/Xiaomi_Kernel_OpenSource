name: Build Kunzite OSS Kernel

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: "Kernel suffix (keep -android15-... format for GKI/KMI)"
        required: false
        default: "-android15-8-kunzite-oss"

jobs:
  build-oss-kmi:
    runs-on: ubuntu-24.04

    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout kunzite-v-oss core kernel
        uses: actions/checkout@v4
        with:
          ref: kunzite-v-oss
          fetch-depth: 1
          path: kernel

      - name: Clone MiCode kernel_devicetree (kunzite-v-oss)
        run: |
          mkdir -p logs
          git clone --depth=1 -b kunzite-v-oss https://github.com/MiCode/kernel_devicetree.git devicetree

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev python3 \
            cpio lz4 zstd zip curl ca-certificates dwarves \
            device-tree-compiler libfdt-dev

      - name: Cache AOSP Clang 18
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: aosp-clang-r522817-v1

      - name: Download AOSP Clang 18 (Android 15 / 6.6)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz" \
            -o clang.tar.gz
          tar -xf clang.tar.gz -C clang
          rm -f clang.tar.gz
          ./clang/bin/clang --version

      - name: Compile KMI-safe kunzite-v-oss Image
        shell: bash
        env:
          LOCALVERSION: ${{ github.event.inputs.localversion }}
        run: |
          set -o pipefail
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          cd kernel
          # Pure gki_defconfig preserves Android 15 6.6 KMI for stock vendor_dlkm/vendor_boot modules
          make O=out LLVM=1 LLVM_IAS=1 gki_defconfig

          scripts/config --file out/.config \
            --disable LOCALVERSION_AUTO \
            --set-str LOCALVERSION "$LOCALVERSION" \
            --enable IKCONFIG \
            --enable IKCONFIG_PROC

          make O=out LLVM=1 LLVM_IAS=1 olddefconfig
          make O=out LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image 2>&1 | tee ../logs/core-build.log

          ls -lh out/arch/arm64/boot/Image

      - name: Compile Kunzite DTBs and overlay DTBO
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          export PATH="$PWD/clang/bin:$PATH"
          DTC="$PWD/kernel/out/scripts/dtc/dtc"
          mkdir -p out_dtbs

          compile_dt() {
            local src="$1"
            local out="$2"
            clang -E -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
              -I "$PWD/kernel/include" \
              -I "$PWD/kernel/arch/arm64/boot/dts" \
              -I "$PWD/devicetree" \
              -I "$PWD/devicetree/qcom" \
              "$src" -o "${out}.dts.tmp"
            "$DTC" -@ -O dtb -Wno-unit_address_vs_reg -Wno-avoid_unnecessary_addr_size \
              -i "$PWD/devicetree/qcom" -i "$PWD/devicetree" -i "$PWD/kernel/include" \
              -o "$out" "${out}.dts.tmp"
          }

          : > logs/devicetree.log
          compile_dt "devicetree/qcom/parrot.dts" "out_dtbs/parrot.dtb" 2>&1 | tee -a logs/devicetree.log || true
          compile_dt "devicetree/qcom/parrotp.dts" "out_dtbs/parrotp.dtb" 2>&1 | tee -a logs/devicetree.log || true
          compile_dt "devicetree/qcom/kunzite-sm6475-overlay.dts" "out_dtbs/kunzite-sm6475-overlay.dtbo" 2>&1 | tee -a logs/devicetree.log || true
          ls -lh out_dtbs/*.dtb out_dtbs/*.dtbo | tee -a logs/devicetree.log

      - name: Package flashable AnyKernel3 zip (boot Image only)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/Image

          cat << 'EOF' > AnyKernel3/anykernel.sh
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=Kunzite OSS 6.6 (KMI-safe)
          do.devicecheck=0
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=kunzite
          supported.versions=15-17
          '; }

          BLOCK=auto;
          IS_SLOT_DEVICE=1;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          split_boot;
          flash_boot;
          EOF

          cd AnyKernel3
          zip -r9 ../AnyKernel3-kunzite-oss.zip * -x .git README.md '*placeholder'
          ls -lh ../AnyKernel3-kunzite-oss.zip

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p dist/dtbs
          cp kernel/out/arch/arm64/boot/Image dist/ 2>/dev/null || true
          cp AnyKernel3-kunzite-oss.zip dist/ 2>/dev/null || true
          cp out_dtbs/*.dtb out_dtbs/*.dtbo dist/dtbs/ 2>/dev/null || true
          ls -lh dist/ dist/dtbs/

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-kmi-logs
          path: logs/

      - name: Upload flashable AnyKernel3 zip, Image, and DTBs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-oss-flashable
          path: dist/
