name: Build Kunzite OSS Kernel

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: "Kernel suffix"
        required: false
        default: "-kunzite-oss"

jobs:
  build-oss:
    runs-on: ubuntu-24.04

    steps:
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout kunzite-v-oss core kernel
        uses: actions/checkout@v4
        with:
          ref: kunzite-v-oss
          fetch-depth: 1
          path: kernel

      - name: Clone Stage 2 MiCode kunzite-v-oss companion repos
        run: |
          mkdir -p techpack logs
          git clone --depth=1 -b kunzite-v-oss https://github.com/MiCode/kernel_devicetree.git devicetree
          git clone --depth=1 -b kunzite-v-oss https://github.com/MiCode/vendor_qcom_opensource_audio-kernel.git techpack/audio
          git clone --depth=1 -b kunzite-v-oss https://github.com/MiCode/vendor_qcom_opensource_camera-kernel.git techpack/camera
          git clone --depth=1 -b kunzite-v-oss https://github.com/MiCode/vendor_qcom_opensource_data-kernel.git techpack/data

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev python3 \
            cpio lz4 zstd zip curl ca-certificates dwarves \
            device-tree-compiler libfdt-dev

      - name: Download AOSP Clang 18 (Android 15 / 6.6)
        run: |
          mkdir -p clang
          curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz" \
            -o clang.tar.gz
          tar -xf clang.tar.gz -C clang
          rm -f clang.tar.gz
          ./clang/bin/clang --version

      - name: Compile core OSS Image and in-tree modules
        shell: bash
        env:
          LOCALVERSION: ${{ github.event.inputs.localversion }}
        run: |
          set -o pipefail
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          cd kernel
          make O=out LLVM=1 LLVM_IAS=1 gki_defconfig

          if [ -f arch/arm64/configs/vendor/parrot_perf.config ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/parrot_perf.config
          fi
          scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/kunzite_perf.config

          scripts/config --file out/.config \
            --disable LOCALVERSION_AUTO \
            --set-str LOCALVERSION "$LOCALVERSION" \
            --enable IKCONFIG \
            --enable IKCONFIG_PROC

          make O=out LLVM=1 LLVM_IAS=1 olddefconfig
          make O=out LLVM=1 LLVM_IAS=1 -j"$(nproc)" Image modules 2>&1 | tee ../logs/core-build.log

      - name: Build Stage 2 - Device Trees (parrot + kunzite overlay)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          export PATH="$PWD/clang/bin:$PATH"
          DTC="$PWD/kernel/out/scripts/dtc/dtc"
          mkdir -p out_dtbs

          compile_dt() {
            local src="$1"
            local out="$2"
            clang -E -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
              -I "$PWD/kernel/include" \
              -I "$PWD/kernel/arch/arm64/boot/dts" \
              -I "$PWD/devicetree" \
              -I "$PWD/devicetree/qcom" \
              "$src" -o "${out}.dts.tmp"
            "$DTC" -@ -O dtb -Wno-unit_address_vs_reg -Wno-avoid_unnecessary_addr_size \
              -i "$PWD/devicetree/qcom" -i "$PWD/devicetree" -i "$PWD/kernel/include" \
              -o "$out" "${out}.dts.tmp"
          }

          : > logs/devicetree.log
          compile_dt "devicetree/qcom/parrot.dts" "out_dtbs/parrot.dtb" 2>&1 | tee -a logs/devicetree.log || true
          compile_dt "devicetree/qcom/parrotp.dts" "out_dtbs/parrotp.dtb" 2>&1 | tee -a logs/devicetree.log || true
          compile_dt "devicetree/qcom/kunzite-sm6475-overlay.dts" "out_dtbs/kunzite-sm6475-overlay.dtbo" 2>&1 | tee -a logs/devicetree.log || true
          ls -lh out_dtbs/*.dtb out_dtbs/*.dtbo | tee -a logs/devicetree.log

      - name: Build Stage 2 - Camera Kernel (camera-kernel)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          CAM_TFE_DIR="$(find techpack/camera -name 'cam_tfe.h' -exec dirname {} \; | head -n 1)"
          echo "cam_tfe.h dir: ${CAM_TFE_DIR:-not found}" | tee logs/camera.log

          KINC="-I$PWD/kernel"
          if [ -n "$CAM_TFE_DIR" ]; then
            KINC="$KINC -I$PWD/$CAM_TFE_DIR"
          fi

          make -C kernel O=out M="$PWD/techpack/camera" \
            CAMERA_KERNEL_ROOT="$PWD/techpack/camera" \
            CAM_ROOT="$PWD/techpack/camera" \
            KERNEL_SRC="$PWD/kernel" \
            KCPPFLAGS="$KINC" \
            LLVM=1 LLVM_IAS=1 \
            -j"$(nproc)" modules 2>&1 | tee -a logs/camera.log

          echo "=== camera .ko produced ===" | tee -a logs/camera.log
          find techpack/camera -name "*.ko" | tee -a logs/camera.log

      - name: Build Stage 2 - Audio Kernel (audio-kernel)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "=== techpack/audio/Kbuild ===" | tee logs/audio.log
          sed -n '1,80p' techpack/audio/Kbuild | tee -a logs/audio.log || true

          make -C kernel O=out M="$PWD/techpack/audio" \
            AUDIO_ROOT="$PWD/techpack/audio" \
            KERNEL_SRC="$PWD/kernel" \
            KCPPFLAGS="-I$PWD/kernel -I$PWD/techpack/audio/include -I$PWD/techpack/audio/include/uapi" \
            LLVM=1 LLVM_IAS=1 \
            -j"$(nproc)" modules 2>&1 | tee -a logs/audio.log

          echo "=== audio .ko produced ===" | tee -a logs/audio.log
          find techpack/audio -name "*.ko" | tee -a logs/audio.log

      - name: Build Stage 2 - Data Kernel (data-kernel)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          export PATH="$PWD/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          echo "=== data-kernel build files ===" | tee logs/data.log
          find techpack/data -maxdepth 4 \( -name "Kbuild" -o -name "Makefile" -o -name "BUILD.bazel" \) | tee -a logs/data.log

          for mf in $(find techpack/data -maxdepth 4 -name "Makefile" ! -path "*emac-dwc-eqos*" 2>/dev/null); do
            dir="$(dirname "$mf")"
            if grep -qE "obj-|KBUILD|modules" "$mf" 2>/dev/null; then
              echo "=== Building $dir ===" | tee -a logs/data.log
              make -C kernel O=out M="$PWD/$dir" \
                DATA_ROOT="$PWD/techpack/data" \
                KERNEL_SRC="$PWD/kernel" \
                KCPPFLAGS="-I$PWD/kernel" \
                LLVM=1 LLVM_IAS=1 \
                -j"$(nproc)" modules 2>&1 | tee -a logs/data.log || true
            fi
          done

          echo "=== data .ko produced ===" | tee -a logs/data.log
          find techpack/data -name "*.ko" | tee -a logs/data.log

      - name: Stage 2 Summary (tail of each module log)
        if: always()
        run: |
          for f in logs/camera.log logs/audio.log logs/data.log; do
            echo "========================================"
            echo "TAIL OF $f"
            echo "========================================"
            tail -n 40 "$f" 2>/dev/null || echo "(no log)"
          done

      - name: Collect compiled OSS artifacts
        if: always()
        run: |
          mkdir -p dist/modules/intree dist/modules/oot dist/dtbs
          cp kernel/out/arch/arm64/boot/Image dist/ 2>/dev/null || true
          find kernel/out -name "*.ko" -exec cp {} dist/modules/intree/ \; 2>/dev/null || true
          find techpack -name "*.ko" -exec cp {} dist/modules/oot/ \; 2>/dev/null || true
          cp out_dtbs/*.dtb out_dtbs/*.dtbo dist/dtbs/ 2>/dev/null || true

          echo "=== Artifact counts ==="
          echo "Image: $(ls -lh dist/Image 2>/dev/null || echo missing)"
          echo "In-tree .ko: $(ls dist/modules/intree | wc -l)"
          echo "Out-of-tree .ko: $(ls dist/modules/oot | wc -l)"
          echo "DTB/DTBO: $(ls dist/dtbs | wc -l)"

      - name: Upload Stage 2 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-logs
          path: logs/

      - name: Upload OSS Image, modules, and DTBs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kunzite-oss-stage2-artifacts
          path: dist/
